FileVersion = 1

[Workspace]
StartupProject = "FormatCore"

# beefbuild -test runs the [Test]s of the first project listed, and of another project only when the
# test config's ConfigSelections select that project's Test config (as in Beef's own IDEHelper/Tests
# workspace): FormatCore.Testing and ToyTests are selected below in every test config.
[Projects]
FormatCore = {Path = "."}
# Test and benchmark helpers for the format libraries' testers (never a dependency of a library)
"FormatCore.Testing" = {Path = "Testing"}
# The toy format on FormatCore.Mapping and its tests (never dependencies of FormatCore itself)
ToyFormat = {Path = "tests/toy"}
ToyTests = {Path = "tests/mapping"}

[Configs.Test.Linux64]
ConfigSelections = {ToyTests = {Config = "Test"}, "FormatCore.Testing" = {Config = "Test"}}

# Runs the [Test] methods with Release settings (O2, CRT allocator, no runtime checks):
#   beefbuild -test -config=TestRelease
[Configs.TestRelease.Linux64]
BuildKind = "Test"
# The projects' Test config (their test build kind) under the workspace's Release settings
ConfigSelections = {ToyTests = {Config = "Test"}, "FormatCore.Testing" = {Config = "Test"}}

# Windows builds link with Beef's bundled lld-link (LLVM toolset) in every config. Beef defaults
# Debug/Test to MSVC's link.exe; with LLVM, MSVC only supplies the CRT and Windows SDK libraries.
[Configs.Debug.Win64]
Toolset = "LLVM"

[Configs.Test.Win64]
Toolset = "LLVM"
ConfigSelections = {ToyTests = {Config = "Test"}, "FormatCore.Testing" = {Config = "Test"}}

[Configs.Release.Win64]
Toolset = "LLVM"

[Configs.TestRelease.Win64]
BuildKind = "Test"
Toolset = "LLVM"
ConfigSelections = {ToyTests = {Config = "Test"}, "FormatCore.Testing" = {Config = "Test"}}
